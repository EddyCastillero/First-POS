services:
  # 1. El Reverse Proxy (La única puerta al exterior)
  proxy:
    image: nginx:alpine
    ports:
      - "8090:80" # Tu compu entra por el 8090, Nginx escucha en el 80
    volumes:
      - ./probando_nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public_net
    depends_on:
      - backend
    restart: unless-stopped

backend:
    build: 
      context: ./backend # Le dice a Docker dónde está el Dockerfile
    
    # EL TRUCO DE SENIOR: Mapeamos tu carpeta local hacia el /app del contenedor.
    # Así, cuando modifiques main.py en tu laptop, el contenedor verá el cambio al instante.
    volumes:
      - ./backend:/app
    
    # Sobrescribimos el comando del Dockerfile para encender el "reload" automático
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/first_pos
    networks:
      - public_net
      - private_net
    depends_on:
      - postgres
    restart: unless-stopped

  # 3. La Bóveda (Invisible y aislada)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: first_pos
    volumes:
      - ./postgres_aprendiendo:/var/lib/postgresql/data
    networks:
      - private_net # Nginx NO tiene acceso a esta red
    restart: unless-stopped

networks:
  public_net:
  private_net:
