# 1. Configuración global de eventos
events {
    # Cuántas conexiones simultáneas puede manejar un "worker" (proceso) de Nginx
    worker_connections 1024;
}

# 2. Configuración HTTP principal
http {
    # Definimos el servidor virtual
    server {
        # Nginx escucha en el puerto 80 interno del contenedor 
        # (Tu compu le manda el tráfico desde el 8090, Nginx lo recibe aquí)
        listen 80;
        
        # El nombre del dominio (para desarrollo local usamos localhost)
        server_name localhost;

        # 3. La regla de ruteo (El corazón del Reverse Proxy)
        location / {
            # Toda petición a la raíz ("/") se reenvía a esta dirección interna:
            # "backend" es el nombre exacto de tu servicio en el docker-compose.yml
            # "8000" es el puerto donde Uvicorn/FastAPI está escuchando
            proxy_pass http://backend:8000;

            # 4. Inyección de Headers (Preservación de Identidad)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}